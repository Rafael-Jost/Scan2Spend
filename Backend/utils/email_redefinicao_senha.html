<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Redefinição de Senha</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f4f4; font-family: Arial, sans-serif;">

  <table width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center" style="padding: 40px 0;">

        <table width="500" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border-radius: 8px; overflow: hidden;">

          <!-- Cabeçalho -->
          <tr>
            <td align="center" style="background-color: #62CDDE; padding: 30px;">
              <img style="border-radius: 100%; background-color: #ffffff;" src="cid:logo_scan2spend" alt="Scan2Spend" width="80" />
              <h1 style="color: #ffffff; margin: 16px 0 0 0; font-size: 22px;">Scan2Spend</h1>
            </td>
          </tr>

          <!-- Conteúdo -->
          <tr>
            <td style="padding: 40px 40px 20px 40px;">
              <h2 style="color: #333333; margin: 0 0 16px 0;">Redefinição de Senha</h2>
              <p style="color: #555555; line-height: 1.6; margin: 0 0 24px 0;">
                Recebemos uma solicitação para redefinir a senha da sua conta.
                Clique no botão abaixo para criar uma nova senha.
              </p>
              <p style="text-align: center; margin: 0 0 24px 0;">
                <a href="http://localhost:5173/reset-senha?token={{token}}"
                   style="background-color: #63D6C9; color: #ffffff; text-decoration: none;
                          padding: 14px 32px; border-radius: 6px; font-size: 16px; font-weight: bold;">
                  Redefinir Senha
                </a>
              </p>
              <p style="color: #888888; font-size: 13px; line-height: 1.5; margin: 0;">
                Se você não solicitou a redefinição de senha, ignore este e-mail.
              </p>
            </td>
          </tr>

          <!-- Rodapé -->
          <tr>
            <td align="center" style="background-color: #f9f9f9; padding: 20px; border-top: 1px solid #eeeeee;">
              <p style="color: #aaaaaa; font-size: 12px; margin: 0;">
                Obrigado por fazer parte &lt;3
              </p>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
